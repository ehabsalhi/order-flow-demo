syntax = "proto3";

option csharp_namespace = "MainServer.Grpc";

package payments;

service Payments {
  rpc CreatePayment (CreatePaymentGrpcRequest) returns (PaymentGrpcReply);
}

message CreatePaymentGrpcRequest {
  int32 order_id = 1;
  string amount = 2;
  string currency = 3;
}

message PaymentGrpcReply {
  int32 payment_id = 1;
  int32 order_id = 2;
  string amount = 3;
  string currency = 4;
  string status = 5;
  string transaction_id = 6;
  string provider = 7;
  string created_at = 8;
  string updated_at = 9;
}
